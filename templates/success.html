<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Generated</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #f9fafc; 
            padding: 50px; 
        }
        .card { 
            background: white; 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            display: inline-block; 
        }
        img { 
            width: 250px; 
            margin-top: 20px; 
        }
        a { 
            text-decoration: none; 
            color: white; 
            background: #2563eb; 
            padding: 10px 25px; 
            border-radius: 8px; 
            display: inline-block; 
            margin-top: 15px; 
            transition: 0.3s; 
        }
        a:hover { background: #1d4ed8; }
        .key-box { 
            background: #f3f4f6; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 10px; 
            margin-top: 15px; 
            word-break: break-all; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
        }
        .copy-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #1d4ed8;
        }
        .copied {
            color: green;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if key %}
        <h2>✅ QR Code & Key Generated!</h2>
        <img src="/static/qrcodes/{{ qr_image }}" alt="QR Code">
        <div class="key-box">
            <strong>Your Key:</strong>
            <span id="encryptionKey">{{ key }}</span>
            <button class="copy-btn" onclick="copyKey()">Copy</button>
        </div>
        <p id="copyMsg" class="copied">Key copied to clipboard ✅</p>
        <p style="color:red;font-size:14px;">⚠️ Save this key — it won't show again.</p>
        <a href="{{ public_link }}">View File Page</a><br><br>
        <a href="/">🏠 Home</a>
        {% else %}
        <h2>🔓 File Unlocked!</h2>
        <a href="{{ public_link }}" target="_blank">Open / Download File</a><br><br>
        <a href="/">🏠 Home</a>
        {% endif %}
    </div>

    <script>
        function copyKey() {
            const keyText = document.getElementById("encryptionKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                const msg = document.getElementById("copyMsg");
                msg.style.display = "block";
                setTimeout(() => { msg.style.display = "none"; }, 2000);
            }).catch(err => {
                alert("Failed to copy key: " + err);
            });
        }
    </script>
</body>
</html>
