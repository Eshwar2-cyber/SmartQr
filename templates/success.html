<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Generated</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f9fafc; padding: 50px; }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; }
        img { width: 250px; margin-top: 20px; }
        a, button { text-decoration: none; color: white; background: #2563eb; padding: 10px 25px; border-radius: 8px; display: inline-block; margin-top: 15px; border: none; cursor: pointer; }
        a:hover, button:hover { background: #1d4ed8; }
        .share-btn { background:#0ea5e9 !important; }
        .key-box { background: #f3f4f6; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 15px; word-break: break-all; display:none; }
    </style>
</head>
<body>

<div class="card">
    <h2>✅ QR Code Generated</h2>
    <img src="/static/qrcodes/{{ qr_image }}" alt="QR Code">

    <div class="key-box" id="keyBox"></div>
    <p id="warn" style="display:none; color:red; font-size:14px;">⚠️ Save this key — it won't show again.</p>

    <a href="{{ public_link }}" target="_blank">View File Page</a><br>

    <button class="share-btn" id="shareBtn">🔗 Share</button><br>

    <a href="/">🏠 Home</a>
</div>

<script>
let key = sessionStorage.getItem("last_upload_key");

// Show key one time
if (key) {
    document.getElementById("keyBox").style.display = "block";
    document.getElementById("keyBox").innerHTML = "<strong>Your Key:</strong><br>" + key;
    document.getElementById("warn").style.display = "block";
}

// SHARE BUTTON
document.getElementById("shareBtn").addEventListener("click", function() {
    let link = "{{ public_link }}";
    let finalKey = key || "(Key shown on page)";
    let text = `Download the file using this link:\n${link}\nKey: ${finalKey}`;

    if (navigator.share) {
        navigator.share({
            title: "Smart QR File Share",
            text: text,
            url: link
        }).catch(() => alert("Sharing cancelled"));
    } else {
        alert("Sharing not supported on this browser 😔");
    }
});
</script>

</body>
</html>
