<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generated</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f9fafc; padding: 50px; }
    .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; max-width:600px; }
    img.qr { width: 250px; margin-top: 15px; border-radius: 10px; }
    .key-box { background:#e6fbe6; padding:12px; border-radius:8px; word-break:break-all; }
    .btn { background:#2563eb;color:white;padding:10px 25px;border-radius:8px;margin:5px;border:none;cursor:pointer }
    .btn:hover{background:#1e4ed8;}
    .danger{color:#d61f1f;margin-top:10px;}
  </style>
</head>
<body>

<div class="card">
  <h2>✅ QR Code & Key Generated!</h2>

  <img class="qr"
       src="{{ url_for('static', filename='qrcodes/' + qr_image) }}?v={{ time }}"
       alt="QR Code">

  <div class="key-box" id="keyBox">
    <strong>Your Key:</strong><br>
    {{ key }}
  </div>

  <br>
  <button class="btn" onclick="copyKey()">Copy Key</button>
  <button class="btn" onclick="openLink()">Open File Page</button>
  <button class="btn" onclick="shareWhatsApp()">Share WhatsApp</button>

  <p class="danger">⚠️ Save this key — it won't show again.</p>

  {% if expires_in %}
  <p>⏳ Expires in <span id="count"></span></p>
  {% endif %}

  <br>
  <button class="btn" onclick="location.href='/'">🏠 Home</button>
</div>

<script>
  function copyKey(){
    let k = document.getElementById("keyBox").innerText.replace("Your Key:","").trim();
    navigator.clipboard.writeText(k);
    alert("Key Copied!");
  }

  function openLink(){
    window.open("{{ public_link }}", "_blank");
  }

  function shareWhatsApp(){
    const t = `File: {{ public_link }}%0AKey: ${document.getElementById("keyBox").innerText}`;
    window.open(`https://wa.me/?text=${t}`);
  }

  {% if expires_in %}
  let t = {{ expires_in }};
  function timer(){
    if(t<=0){ document.getElementById("count").innerText="Expired"; return; }
    const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
    document.getElementById("count").innerText = `${h}h ${m}m ${s}s`;
    t--;
  }
  timer();
  setInterval(timer,1000);
  {% endif %}
</script>

</body>
</html>
