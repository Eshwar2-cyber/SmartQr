<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code & Key Generated</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6fb; text-align:center; padding:40px; }
        .card { width: 500px; max-width:90%; background:#fff; border-radius:14px; padding:28px; box-shadow:0 8px 25px rgba(0,0,0,.08); margin:auto; }
        h2 { margin: 0 0 12px; color:#111; font-size:26px; }
        img.qr { width:230px; height:auto; margin:10px auto; display:block; border-radius:8px; }
        .keybox { background:#eefaf0; border:1px solid #cce7d0; padding:12px; border-radius:8px; font-family:monospace; word-break:break-all; margin-top:12px; font-size:15px;}
        
        .btn { background:#2563eb; color:white; padding:12px 20px; border:none; border-radius:8px; margin:8px; cursor:pointer; font-size:15px; }
        .btn:hover { background:#1e4ed8; }
        
        .warn { color:#e11d48; margin-top:10px; }
        .time { color:#374151; font-size:15px; margin-top:6px; }
    </style>
</head>

<body>
<div class="card">
    <h2>✅ QR Code & Key Generated!</h2>

    <img class="qr" src="/static/qrcodes/{{ qr_image }}" alt="QR Code">

    <div class="keybox" id="keyBox">{{ key }}</div>

    <button class="btn" onclick="copyKey()">Copy Key</button>
    <button class="btn" onclick="openPage()">Open File Page</button>
    <button class="btn" onclick="shareBoth()">Share Link + Key</button>

    <p class="warn">⚠️ Save this key — it won't show again.</p>

    {% if expires_in is not none %}
    <p class="time">⏳ Expires in <span id="exp"></span></p>
    {% endif %}

    <button class="btn" onclick="location.href='/'">🏠 Home</button>
</div>

<script>
const publicLink = "{{ public_link }}";
const keyText = "{{ key }}";

function copyKey(){
    navigator.clipboard.writeText(keyText).then(()=>alert("✅ Key copied!"));
}

function openPage(){
    window.open(publicLink, "_blank");
}

function shareBoth(){
    const msg = `🔐 Encrypted File: ${publicLink}\n🔑 Key: ${keyText}`;
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}

{% if expires_in is not none %}
let t = {{ expires_in }};
function timer(){
    if(t <= 0){ document.getElementById("exp").textContent = "Expired"; return; }
    let h = Math.floor(t/3600);
    let m = Math.floor((t%3600)/60);
    let s = t % 60;
    document.getElementById("exp").textContent = `${h}h ${m}m ${s}s`;
    t--;
}
timer();
setInterval(timer, 1000);
{% endif %}
</script>

</body>
</html>
