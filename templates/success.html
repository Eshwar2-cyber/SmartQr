<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Generated</title>
<style>
 body{text-align:center;font-family:Arial;padding:60px;background:#f9fafc}
 .box{background:white;padding:25px;border-radius:10px;display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,.1)}
 button,a{text-decoration:none;color:white;background:#2563eb;padding:10px 22px;border-radius:8px;margin-top:10px;display:inline-block;border:none}
 .copy{background:#059669}
</style>
</head>
<body>
<div class="box">
  <h2>✅ QR Created</h2>
  <img src="{{ url_for('static', filename='qrcodes/' + filename + '_qr.png') }}" width="240">

  <p><b>Key (Save it!)</b></p>
  <div id="k">{{ sessionStorage.last_key }}</div>

  <button class="copy" onclick="copyKey()">Copy Key</button><br>
  <a href="/view/{{ filename }}">View File Page</a><br>
  <a href="/">Home</a>
</div>

<script>
function copyKey(){
  navigator.clipboard.writeText(sessionStorage.getItem("last_key"));
  alert("Copied!");
}
</script>
</body>
</html>
