<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Generated</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f9fafc; padding: 50px; }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; }
        img { width: 250px; margin-top: 20px; }
        a, button { text-decoration: none; color: white; background: #2563eb; padding: 10px 25px; border-radius: 8px; display: inline-block; margin-top: 15px; border: none; cursor: pointer; }
        a:hover, button:hover { background: #1d4ed8; }
        .share-btn { background:#0ea5e9 !important; }
        .copy-btn { background:#059669 !important; }
        
        .key-row { 
            background: #f3f4f6; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            padding: 10px; 
            margin-top: 15px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            word-break: break-all;
        }

        #warn { color:red; font-size:14px; display:none; }
        #countdown { margin-top:10px; font-weight:600; color:#444; }
    </style>
</head>
<body>

<div class="card">
    <h2>✅ QR Code Generated</h2>

    <img src="{{ qr_image }}" alt="QR Code">

    <!-- Hidden upload time -->
    <input type="hidden" id="uploadedAt" value="{{ uploaded_at }}">

    <!-- Key + Copy Button INLINE ✅ -->
    <div class="key-row" id="keyRow" style="display:none;">
        <span id="keyText"></span>
        <button class="copy-btn" id="copyBtn">📋 Copy</button>
    </div>

    <p id="warn">⚠️ Save this key — it won't show again.</p>
    <p id="countdown"></p>

    <a href="{{ public_link }}" target="_blank">View File Page</a><br>

    <button class="share-btn" id="shareBtn">🔗 Share</button><br>

    <a href="/">🏠 Home</a>
</div>

<script>
const key = sessionStorage.getItem("last_upload_key");

// ✅ Show key and copy inline
if (key) {
    document.getElementById("keyRow").style.display = "flex";
    document.getElementById("keyText").textContent = key;
    document.getElementById("warn").style.display = "block";
}

// ✅ Copy button
document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(key)
        .then(() => alert("✅ Key copied!"))
        .catch(() => alert("❌ Could not copy key"));
});

// ✅ Share
document.getElementById("shareBtn").addEventListener("click", function() {
    let text = `Download:\n{{ public_link }}\nKey: ${key}`;
    if (navigator.share) {
        navigator.share({ title:"Smart QR File Share", text, url:"{{ public_link }}" });
    } else {
        alert("Sharing not supported on this browser 😔");
    }
});

// ✅ Countdown on success page
const uploadedAt = parseFloat(document.getElementById("uploadedAt").value);
const countdown = document.getElementById("countdown");

if (uploadedAt) {
    function update() {
        const now = Date.now() / 1000;
        const expire = uploadedAt + 86400;
        const remain = expire - now;

        if (remain <= 0) {
            countdown.textContent = "❌ File has expired";
            return;
        }

        const h = Math.floor(remain / 3600);
        const m = Math.floor((remain % 3600) / 60);
        const s = Math.floor(remain % 60);

        countdown.textContent = `⏳ Expires in: ${h}h ${m}m ${s}s`;
    }

    update();
    setInterval(update, 1000);
}

// ✅ remove key after leaving
window.addEventListener("beforeunload", () => {
    sessionStorage.removeItem("last_upload_key");
});
</script>

</body>
</html>
