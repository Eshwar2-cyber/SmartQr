<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Upload Complete</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f7ff;padding:50px}
.card{background:#fff;padding:25px;border-radius:10px;display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,.15);width:340px}
img{width:200px;margin-top:10px;border-radius:8px}
.btn{display:block;margin:8px auto;padding:10px 18px;background:#2563eb;color:white;text-decoration:none;border-radius:6px;width:240px;border:none;cursor:pointer}
.copy{background:#10b981 !important}
.share{background:#9333ea !important}
.keybox{background:#111;color:#fff;padding:8px;border-radius:6px;margin:10px auto;width:240px;word-break:break-all;font-size:14px}
.timer{font-size:14px;color:#555;margin-top:8px}
</style>
</head>
<body>

<div class="card">
  <h2>✅ Upload Finished</h2>

  <img src="{{ qr }}">

  <p><b>Encrypted File Link:</b></p>
  <a class="btn" href="{{ public }}" target="_blank">Open Link</a>
  <button class="btn copy" onclick="copyLink()">Copy File Link</button>

  <p><b>Decryption Key:</b></p>
  <div class="keybox" id="keyText">{{ request.args.get('key', session.get('key','NOT SHOWN')) }}</div>
  <button class="btn copy" onclick="copyKey()">Copy Key</button>

  <a class="btn share" target="_blank"
     href="https://wa.me/?text=Download%20encrypted%20file:%20{{ public }}">
     Share on WhatsApp
  </a>

  <a class="btn share" target="_blank"
     href="https://t.me/share/url?url={{ public }}&text=Encrypted%20file">
     Share on Telegram
  </a>

  {% if expires_in %}
  <p class="timer">⏳ Expires in: <span id="time"></span></p>
  {% endif %}

  <a class="btn" style="background:#222" href="/">Home</a>
</div>

<script>
function copyLink(){
  navigator.clipboard.writeText("{{ public }}");
  alert("✅ Link Copied!");
}

function copyKey(){
  let t = document.getElementById("keyText").innerText;
  navigator.clipboard.writeText(t);
  alert("✅ Key Copied!");
}

{% if expires_in %}
let remain = {{ expires_in }};
function tick(){
  if(remain <= 0){
    document.getElementById("time").innerText = "Expired";
    return;
  }
  let h = Math.floor(remain/3600);
  let m = Math.floor((remain%3600)/60);
  let s = remain % 60;
  document.getElementById("time").innerText = `${h}h ${m}m ${s}s`;
  remain--;
}
tick();
setInterval(tick, 1000);
{% endif %}
</script>

</body>
</html>
