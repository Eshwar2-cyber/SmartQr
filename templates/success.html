<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Generated</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f9fafc; padding: 50px; }
    .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; max-width: 520px; width: 100%; }
    img.qr { width: 250px; height: auto; margin-top: 20px; border-radius: 8px;}
    .btn { text-decoration:none; color:white; background:#2563eb; padding:10px 25px; border-radius:8px; display:inline-block; margin-top:10px; cursor:pointer; border:none;}
    .btn:hover { background:#1d4ed8; }
    .key-box { background:#e6fdf0; border:1px solid #10b981; color:#065f46; border-radius:8px; padding:12px; margin-top:15px; font-family:monospace; font-size:15px; word-break:break-all; }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
    .danger { color:#e11d48; font-size:14px;}
    .muted { color:#374151; font-size:14px; margin-top:10px;}
  </style>
</head>
<body>
  <div class="card">
    <h2>✅ QR Code & Key Generated!</h2>

    <!-- ✅ Cache-busted QR so it never breaks -->
    <img class="qr" src="{{ url_for('static', filename='qrcodes/' + qr_image) }}?v={{ expires_in }}" alt="QR Code">

    <div class="key-box" id="keyBox">{{ key }}</div>

    <div class="row">
      <button class="btn" onclick="copyKey()">Copy Key</button>
      <button class="btn" onclick="shareLink()">Share Link + Key</button>
      <a class="btn" href="{{ public_link }}" target="_blank">Open File Page</a>
    </div>

    <p class="danger">⚠️ Save this key — it won't show again.</p>

    {% if expires_in is not none %}
      <p class="muted">⏳ Expires in <span id="count"></span></p>
    {% endif %}

    <a class="btn" href="/">🏠 Home</a>
  </div>

<script>
  const link = "{{ public_link }}";
  const key = "{{ key }}";

  function copyKey(){
    navigator.clipboard.writeText(key);
    alert("✅ Key Copied");
  }

  function shareLink(){
    const text = `Download File:\n${link}\nKey: ${key}`;
    if(navigator.share){
      navigator.share({ text:text, url:link });
    } else {
      navigator.clipboard.writeText(text);
      alert("✅ Link & Key Copied to Clipboard");
    }
  }

  {% if expires_in is not none %}
  let t = {{ expires_in }};
  function timer(){
    if(t <= 0){
      document.getElementById("count").innerHTML = "Expired";
      return;
    }
    const h = Math.floor(t/3600),
          m = Math.floor((t%3600)/60),
          s = t%60;
    document.getElementById("count").innerHTML = `${h}h ${m}m ${s}s`;
    t--;
  }
  timer();
  setInterval(timer, 1000);
  {% endif %}
</script>

</body>
</html>
