<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Generated</title>
<style>
  body{font-family:Arial;text-align:center;background:#f9fafc;padding:40px}
  .card{background:#fff;padding:30px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:inline-block;width:90%;max-width:500px}
  img{width:240px;margin:10px}
  .key-box{background:#e8ffe8;border:1px solid #b2e6b2;padding:10px;border-radius:8px;margin-top:10px;font-family:monospace}
  .btn{padding:10px 22px;border:none;border-radius:8px;background:#2563eb;color:#fff;margin:6px;cursor:pointer}
</style>
</head>
<body>

<div class="card">
  <h2>✅ QR Code & Key Generated!</h2>

  <img class="qr" 
     src="{{ public }}/static/qrcodes/{{ qr_image }}?v={{ uuid }}" 
     alt="QR Code">

  <div class="key-box" id="keyBox">{{ key }}</div>

  <div>
    <button class="btn" onclick="copyKey()">Copy Key</button>
    <a class="btn" href="{{ public }}/view/{{ filename }}" target="_blank">Open File Page</a>
  </div>

  <p style="color:red">⚠️ Save this key — it won't show again.</p>

  {% if expires_in is not none %}
    <p>⏳ Expires in <span id="count"></span></p>
  {% endif %}

  <a class="btn" href="/">🏠 Home</a>
</div>

<script>
function copyKey(){
  const k = document.getElementById("keyBox").innerText;
  navigator.clipboard.writeText(k);
  alert("Key Copied!");
}
{% if expires_in is not none %}
let t = {{ expires_in }};
function tick(){
  if(t<=0){ document.getElementById("count").innerText="Expired"; return; }
  let h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
  document.getElementById("count").innerText=`${h}h ${m}m ${s}s`;
  t--;
}
tick(); setInterval(tick,1000);
{% endif %}
</script>

</body>
</html>
