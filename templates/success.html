<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Generated</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f9fafc; padding: 50px; }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; }
        a, button { text-decoration: none; color: white; background: #2563eb; padding: 10px 25px; border-radius: 8px; margin-top: 15px; display: inline-block; border: none; cursor: pointer; }
        button:hover, a:hover { background: #1d4ed8; }
        .key-box { display:flex; background:#f3f4f6; padding:10px; border-radius:8px; border:1px solid #ddd; gap:10px; align-items:center; justify-content:center; word-break: break-all; }
        .copy-btn { background:#059669; }
        #warn { color:red; }
        #countdown { font-weight:bold; margin-top:10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>✅ QR Code Generated</h2>

    <!-- ✅ QR ALWAYS WORKS -->
    <img src="{{ qr_url }}" alt="QR Code" width="230">

    <!-- upload time -->
    <input type="hidden" id="uploadedAt" value="{{ uploaded_at }}">

    <!-- Key & Copy Button -->
    <div class="key-box" id="keyRow" style="display:none;">
        <span id="keyText"></span>
        <button class="copy-btn" id="copyBtn">Copy</button>
    </div>

    <p id="warn" style="display:none;">⚠️ Save this key — it won't show again.</p>
    <p id="countdown"></p>

    <a href="{{ public_link }}" target="_blank">View File Page</a><br>
    <button onclick="shareFile()">🔗 Share</button><br>
    <a href="/">🏠 Home</a>
</div>

<script>
const key = sessionStorage.getItem("last_upload_key");

// ✅ show key inline
if (key) {
    keyRow.style.display = "flex";
    keyText.textContent = key;
    warn.style.display = "block";
}

// ✅ copy button
copyBtn.onclick = () => navigator.clipboard.writeText(key).then(()=>alert("✅ Copied"));

// ✅ share button
function shareFile() {
    let text = "File link: {{ public_link }}\nKey: " + key;
    if (navigator.share) {
        navigator.share({ text, url:"{{ public_link }}" });
    } else {
        alert("Sharing not supported");
    }
}

// ✅ countdown
const uploadedAt = parseFloat(document.getElementById("uploadedAt").value);
function update() {
    if (!uploadedAt) return;

    const now = Date.now() / 1000;
    const remain = (uploadedAt + 86400) - now;

    if (remain <= 0) {
        countdown.textContent = "❌ File expired";
        return;
    }
    const h = Math.floor(remain/3600);
    const m = Math.floor((remain%3600)/60);
    const s = Math.floor(remain%60);
    countdown.textContent = `⏳ Expires in: ${h}h ${m}m ${s}s`;
}

update();
setInterval(update, 1000);

// ✅ remove key when leaving
window.addEventListener("beforeunload", ()=>sessionStorage.removeItem("last_upload_key"));
</script>

</body>
</html>
