<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Unlocked</title>
    <style>
        body { font-family: Arial; text-align: center; background:#f9fafc; padding: 50px; }
        .card { background:white; padding:40px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); display:inline-block; }
        a, button { text-decoration: none; color:white; background:#2563eb; padding:10px 25px; border-radius:8px; display:inline-block; margin-top:15px; }
        a:hover, button:hover { background:#1d4ed8; }
        .preview { background:#10b981; }
    </style>
</head>
<body>

<div class="card">
    <h2>✅ File Unlocked Successfully</h2>

    <!-- ✅ Preview button (opens in browser) -->
    <a class="preview" href="{{ file_link }}" target="_blank">👁️ Preview File</a><br>

    <!-- ✅ Download button -->
    <a href="{{ file_link }}" download>⬇️ Download File</a><br>

    <a href="/">🏠 Home</a>
</div>

</body>
</html>
