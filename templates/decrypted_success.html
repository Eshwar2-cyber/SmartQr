<!DOCTYPE html>
<html>
<head>
    <title>File Ready</title>
    <style>
        body { text-align:center; font-family: Arial; background:#f9fafc; padding:50px; }
        .card { background:white; padding:30px; border-radius:10px; display:inline-block; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        a { text-decoration:none; display:block; margin-top:15px; padding:12px; border-radius:8px; color:white; }
        .download { background:#2563eb; }
        .preview { background:#059669; }
    </style>
</head>
<body>
<div class="card">
    <h2>✅ File Decrypted Successfully</h2>
    <a class="download" href="/download/{{ filename }}">⬇ Download File</a>
    <a class="preview" href="/preview/{{ filename }}" target="_blank">👁 Preview File</a>
    <br><a href="/">🏠 Home</a>
</div>
</body>
</html>
