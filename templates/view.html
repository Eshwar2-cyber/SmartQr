<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Encrypted File</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f9fafc; text-align:center; padding-top:80px; }
        .card {
            background:white; padding:35px; border-radius:12px;
            display:inline-block; box-shadow:0 6px 20px rgba(0,0,0,0.08);
            width:340px;
        }
        a.btn {
            display:inline-block; width:100%; margin-top:15px; padding:12px;
            background:#2563eb; color:#fff; text-decoration:none; border-radius:8px;
        }
        a.btn:hover { background:#1d4ed8; }
        .muted { color:#374151; font-size:14px; margin-top:10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 File is Protected</h2>
    <p>You must enter the decryption key to unlock.</p>

    <a class="btn" href="/unlock/{{ filename }}">Enter Key</a>

    {% if countdown %}
    <p class="muted">⏳ Expires in <span id="count"></span></p>
    {% endif %}
</div>

<script>
// prevents vscode errors
{% if countdown %}
let t = {{ countdown }};
function timer(){
    const el = document.getElementById("count");
    if(t <= 0){ el.textContent = "Expired"; return; }
    const h = Math.floor(t/3600);
    const m = Math.floor((t%3600)/60);
    const s = t%60;
    el.textContent = `${h}h ${m}m ${s}s`;
    t--;
}
timer();
setInterval(timer,1000);
{% endif %}
</script>

</body>
</html>
