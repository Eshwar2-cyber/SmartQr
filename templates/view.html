<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Encrypted File</title>
    <style>
        body { font-family: Arial, sans-serif; text-align:center; padding:60px; background:#f4f6fb; }
        .card { width:360px; background:white; padding:30px; border-radius:15px;
                box-shadow:0 6px 22px rgba(0,0,0,.08); display:inline-block; }
        a.btn { background:#2563eb; color:white; padding:12px 20px;
                border-radius:8px; text-decoration:none; display:inline-block; margin-top:15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 File is Encrypted</h2>
        <p>Enter key to unlock</p>
        <a class="btn" href="/unlock/{{ filename }}">Enter Key</a>
    </div>
</body>
</html>
