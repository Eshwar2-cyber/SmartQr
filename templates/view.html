<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unlock File</title>
  <style>
    body{font-family:Arial;text-align:center;background:#f9fafc;padding:50px}
    .card{background:#fff;padding:30px;border-radius:10px;
      display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,.1)}
    input,button{padding:10px;width:260px;border-radius:6px;border:1px solid #aaa;margin-top:10px}
    button{background:#2563eb;color:#fff;border:none}
  </style>
</head>
<body>
<div class="card">
  <h2>🔓 Unlock File</h2>
  <form method="POST" action="{{ url_for('unlock', filename=filename) }}">
    <input type="text" name="key" placeholder="Enter Key" required><br>
    <button type="submit">Unlock & Continue</button>
  </form>
  <br><a href="/">🏠 Home</a>
</div>
</body>
</html>
