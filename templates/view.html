<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>File Page</title>
<style>
 body{text-align:center;font-family:Arial;padding:60px;background:#f9fafc}
 .box{background:white;padding:25px;border-radius:10px;display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,.1)}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 Encrypted File</h2>
  <p>This file is encrypted. You must unlock it.</p>
  <a href="/unlock/{{ filename }}" style="background:#2563eb;color:white;padding:10px 22px;border-radius:8px;text-decoration:none">Unlock</a>
  <br><br>
  <a href="/">🏠 Home</a>
</div>
</body>
</html>
