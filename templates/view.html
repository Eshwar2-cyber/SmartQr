<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Encrypted File</title>
<style>
  body{font-family:Arial;text-align:center;padding:60px;background:#f4f7ff}
  .card{background:white;padding:35px;border-radius:14px;display:inline-block;box-shadow:0 6px 20px rgba(0,0,0,.1);width:350px}
  .btn{background:#2563eb;color:white;padding:10px 25px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:15px}
  .btn:hover{background:#1d4ed8}
  .muted{font-size:14px;color:#374151;margin-top:10px}
</style>
</head>
<body>

<div class="card">
  <h2>🔒 File is encrypted</h2>
  <p>Enter the key to unlock this file</p>

  <a class="btn" href="/unlock/{{ filename }}">Enter Key</a>

  {% if countdown is not none %}
  <p class="muted">⏳ Expires in <span id="exp"></span></p>
  {% endif %}
</div>

<script>
{% if countdown is not none %}
let t = {{ countdown }};
function timer(){
  if(t<=0){ document.getElementById("exp").textContent="Expired"; return; }
  const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
  document.getElementById("exp").textContent=`${h}h ${m}m ${s}s`; t--;
}
timer(); setInterval(timer,1000);
{% endif %}
</script>

</body>
</html>
