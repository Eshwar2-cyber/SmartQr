<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unlock File</title>
<style>
  body{font-family:Arial;text-align:center;background:#f9fafc;padding:60px}
  .card{background:white;padding:35px;border-radius:14px;display:inline-block;box-shadow:0 6px 20px rgba(0,0,0,.1)}
  input,button{padding:12px;margin-top:10px;width:260px;border-radius:8px;border:1px solid #bbb}
  button{background:#2563eb;color:white;border:none;cursor:pointer}
  button:hover{background:#1d4ed8}
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Enter Key</h2>
  <form method="POST" action="/decrypt/{{ filename }}">
    <input type="text" name="key" placeholder="Enter key" required><br>
    <button type="submit">Unlock</button>
  </form>
  <a href="/" style="display:block;margin-top:10px">🏠 Home</a>
</div>
</body>
</html>
