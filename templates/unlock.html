<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Key</title>
    <style>
        body { text-align:center; font-family:Arial; background:#eef2ff; padding-top:80px; }
        .card { background:white; padding:30px; border-radius:14px;
                box-shadow:0 6px 20px rgba(0,0,0,.1); display:inline-block; }
        input { width:250px; padding:10px; margin:10px; border:1px solid #ccc; border-radius:8px; }
        button { background:#2563eb; color:white; border:none; padding:10px 22px;
                 border-radius:8px; cursor:pointer; }
        button:hover { background:#1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Unlock File</h2>

        <form method="POST" action="/decrypt/{{ filename }}">
            <input type="text" name="key" placeholder="Enter Decryption Key" required><br>
            <button type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
