<!DOCTYPE html>
<html>
<head>
<title>Video Preview</title>
<style>
body{text-align:center;font-family:Arial;padding-top:60px;background:#f7f9ff}
video{max-width:90%;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.2)}
a{display:block;margin-top:20px;padding:10px 20px;background:#2563eb;color:white;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<h2>✅ Video Decrypted</h2>
<video controls>
  <source src="{{ video }}">
  Your browser doesn't support video playback.
</video>
<a href="{{ video }}" download>Download Video</a>
</body>
</html>
