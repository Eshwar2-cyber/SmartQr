<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR File Share</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f9f9f9, #e9eef5); text-align: center; padding-top: 100px; }
        .upload-box { border: 2px dashed #2b6cb0; padding: 40px; border-radius: 15px; background: #f1f5fb; display: inline-block; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { background: #e0ebff; }
        input[type="file"] { display: none; }
        .btn { background: #2b6cb0; color: white; padding: 10px 25px; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; }
        #fileName { margin-top: 10px; color: #333; font-weight: bold; }
        #progressBar { width: 70%; max-width: 560px; margin: 16px auto; background: #e5e7eb; border-radius: 12px; height: 18px; display:none; overflow:hidden; }
        #progress { height: 100%; width: 0%; background: #2b6cb0; border-radius: 12px; transition: width .2s; }
        #eta { font-weight: 600; margin-top: 8px; }
    </style>
</head>
<body>

<h1>📂 Smart QR File Share</h1>
<p>Upload any file & get encrypted QR download</p>

<form onsubmit="return false;">
    <label class="upload-box">
        <strong>📤 Click to select file</strong>
        <input type="file" id="fileInput" required>
    </label>
    <div id="fileName"></div>

    <div id="progressBar"><div id="progress"></div></div>
    <p id="eta"></p>

    <button class="btn" onclick="startUpload()">Generate QR</button>
</form>

<script>
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const progressBar = document.getElementById("progressBar");
const progress = document.getElementById("progress");
const etaText = document.getElementById("eta");

fileInput.addEventListener("change", () => {
    if (fileInput.files.length)
        fileName.textContent = "✅ Selected: " + fileInput.files[0].name;
});

async function startUpload() {
    const file = fileInput.files[0];
    if (!file) return alert("Select a file first!");

    const chunkSize = 2 * 1024 * 1024; // ✅ 2MB chunks (fixed)
    const totalChunks = Math.ceil(file.size / chunkSize);
    const fileId = Date.now().toString();
    const encodedName = encodeURIComponent(file.name);

    progressBar.style.display = "block";
    let uploaded = 0;
    let startT = Date.now();

    for (let i = 0; i < totalChunks; i++) {
        const start = i * chunkSize;
        const chunk = file.slice(start, start + chunkSize);

        let form = new FormData();
        form.append("chunk", chunk);
        form.append("file_id", fileId);
        form.append("filename", file.name);
        form.append("index", i);

        // ✅ Retry chunk upload if network issue
        let ok = false;
        for (let attempt = 0; attempt < 5; attempt++) {
            try {
                await fetch(`/upload_chunk`, { method: "POST", body: form });
                ok = true;
                break;
            } catch {
                await new Promise(r => setTimeout(r, 1000));
            }
        }
        if (!ok) return alert("❌ Network error. Try again.");

        uploaded++;
        let percent = Math.round((uploaded / totalChunks) * 100);
        progress.style.width = percent + "%";

        let elapsed = (Date.now() - startT) / 1000;
        let speed = uploaded / elapsed;
        let remain = (totalChunks - uploaded) / speed;

        etaText.textContent = `⏳ ${percent}% uploaded — Est: ${remain.toFixed(1)}s`;

        // ✅ small pause avoids timeout on Render free tier
        await new Promise(r => setTimeout(r, 20));
    }

    // ✅ finish_upload with retry
    let data = null;
    for (let attempt = 0; attempt < 5; attempt++) {
        try {
            const res = await fetch(`/finish_upload?file_id=${fileId}&filename=${encodedName}`);
            data = await res.json();
            break;
        } catch {
            await new Promise(r => setTimeout(r, 2000));
        }
    }

    if (!data || data.status !== "ok") {
        return alert("❌ Server timeout. Try again.");
    }

    sessionStorage.setItem("last_upload_key", data.key);

    etaText.textContent = "✅ Upload complete!";
    window.location.href = `/success/${encodedName}`;
}
</script>

</body>
</html>
