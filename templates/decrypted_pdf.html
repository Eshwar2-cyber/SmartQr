<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Preview</title>
<style>
  body{text-align:center;background:#fafafa;padding-top:40px;font-family:Arial}
  iframe{width:90%;height:80vh;border:none;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.12)}
  a{display:block;margin-top:20px;background:#2563eb;color:white;padding:10px 20px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<h2>✅ PDF Decrypted</h2>
<iframe src="{{ pdf }}"></iframe>
<a href="{{ pdf }}" download>Download</a>
<a href="/">🏠 Home</a>
</body>
</html>
